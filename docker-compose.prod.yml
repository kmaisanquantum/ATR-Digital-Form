services:
  postgres:
    image: postgres:15-alpine
    container_name: atr-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atr_db
    ports:
      - "5432:5432"
    volumes:
      - pg_prod_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atr-prod-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/atr_db?schema=public
      - JWT_SECRET=pngdf_aviation_super_secret_jwt_key_2026
      - PORT=5000
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atr-prod-frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE=/api
    depends_on:
      - backend

volumes:
  pg_prod_data:
